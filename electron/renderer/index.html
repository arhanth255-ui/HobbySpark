<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HobbySpark</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header id="menubar">

        <h1 class="app-title">⚡ HobbySpark</h1>

        <nav class="menu-items">

            <div class="menu-container">
                <button class="menu-item">File</button>
                <div class="dropdown">
                    <button class="dropdown-item" id="open-folder">Open Folder <span>Ctrl+O</span></button>
                    <button class="dropdown-item" id="new-file">New File <span>Ctrl+N</span></button>

                    <div class="submenu-container">
                        <button class="dropdown-item submenu-trigger">
                            Open Recent Folder
                            <span>▶</span>
                        </button>

                        <div class="submenu" id="recent-folders">
                            <button class="dropdown-item">No recent folders</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="menu-container">
                <button class="menu-item">Edit</button>
                <div class="dropdown">
                    <button class="dropdown-item" id="undo">Undo <span>Ctrl+Z</span></button>
                    <button class="dropdown-item" id="redo">Redo <span>Ctrl+Y</span></button>
                    <div class="menu-separator"></div>
                    <button class="dropdown-item" id="cut">Cut <span>Ctrl+X</span></button>
                    <button class="dropdown-item" id="copy">Copy <span>Ctrl+C</span></button>
                    <button class="dropdown-item" id="paste">Paste <span>Ctrl+V</span></button>
                </div>
            </div>

            <div class="menu-container">
                <button class="menu-item">Run</button>
                <div class="dropdown">
                    <button class="dropdown-item" id="transpile-test">Transpile Test</button>
                    <div class="menu-separator"></div>
                    <button class="dropdown-item" id="lex">Lex</button>
                    <button class="dropdown-item" id="parse">Visualize AST</button>
                    <button class="dropdown-item" id="transpile">Show Transpiled Output</button>
                </div>
            </div>

            <div class="menu-container">
                <button class="menu-item">Advanced tools</button>
                <div class="dropdown">
                    <button class="dropdown-item">Reload</button>
                    <button class="dropdown-item">Toggle DevTools</button>
                    <button class="dropdown-item">Toggle Fullscreen</button>
                </div>
            </div>

            <div class="menu-container">
                <button class="menu-item">Preferences</button>
                <div class="dropdown">
                    <button class="dropdown-item">Change User Settings</button>
                    <button class="dropdown-item">Change Theme</button>
                </div>
            </div>

            <div class="menu-container">
                <button class="menu-item">Help</button>
                <div class="dropdown">
                    <button class="dropdown-item">Documentation</button>
                    <button class="dropdown-item">License</button>
                    <button class="dropdown-item">About</button>
                </div>
            </div>

        </nav>
    </header>


    <div class="work">
        <div id="activity-bar">
            <button class="activity-button selected" id="explorer-button" data-tooltip="Explorer">
                <span class="activity-icon icon-folder"></span>
            </button>

            <button class="activity-button" id="arduino-button" data-tooltip="Settings">
                <span class="activity-icon icon-cpu"></span>
            </button>
        </div>

        <aside class="panel" id="arduino-panel">
            <h4>Choose your board</h4>
            <select id="board-selector" name="board">
                <optgroup label="Arduino AVR">
                    <option value="ArduinoUnoR3" selected>Arduino Uno R3</option>
                    <option value="ArduinoNano">Arduino Nano</option>
                    <option value="ArduinoMega2560">Arduino Mega 2560</option>
                    <option value="ArduinoLeonardo">Arduino Leonardo</option>
                    <option value="ArduinoMicro">Arduino Micro</option>
                    <option value="ArduinoMini">Arduino Mini</option>
                    <option value="ArduinoProMini">Arduino Pro Mini</option>
                    <option value="ArduinoLilyPad">Arduino LilyPad</option>
                </optgroup>

                <optgroup label="Arduino megaAVR">
                    <option value="ArduinoNanoEvery">Arduino Nano Every</option>
                    <option value="ArduinoUnoWiFiRev2">Arduino Uno WiFi Rev2</option>
                </optgroup>

                <optgroup label="Arduino SAM">
                    <option value="ArduinoDue">Arduino Due</option>
                </optgroup>

                <optgroup label="Arduino SAMD">
                    <option value="ArduinoZero">Arduino Zero</option>
                    <option value="AdafruitFeatherM0">Adafruit Feather M0</option>
                    <option value="SeeeduinoXIAO">Seeeduino XIAO</option>
                </optgroup>

                <optgroup label="Arduino GIGA">
                    <option value="ArduinoGigaR1">Arduino GIGA R1</option>
                </optgroup>

                <optgroup label="ESP32">
                    <option value="ESP32DevKit">ESP32 DevKit</option>
                    <option value="ESP32C3">ESP32-C3</option>
                    <option value="ESP32S2">ESP32-S2</option>
                    <option value="ESP32S3">ESP32-S3</option>
                    <option value="ArduinoNanoESP32">Arduino Nano ESP32</option>
                    <option value="AdafruitFeatherESP32S2">Adafruit Feather ESP32-S2</option>
                    <option value="SeeeduinoXIAOESP32C3">Seeed XIAO ESP32-C3</option>
                </optgroup>

                <optgroup label="ESP8266">
                    <option value="ESP8266NodeMCU">ESP8266 NodeMCU</option>
                    <option value="ESP8266D1Mini">ESP8266 D1 Mini</option>
                </optgroup>

                <optgroup label="RP2040">
                    <option value="RaspberryPiPico">Raspberry Pi Pico</option>
                    <option value="RaspberryPiPicoW">Raspberry Pi Pico W</option>
                </optgroup>

                <optgroup label="STM32">
                    <option value="STM32BluePill">STM32 Blue Pill</option>
                    <option value="STM32BlackPill">STM32 Black Pill</option>
                </optgroup>

                <optgroup label="Teensy">
                    <option value="Teensy40">Teensy 4.0</option>
                    <option value="Teensy41">Teensy 4.1</option>
                </optgroup>
            </select>
            <h4>Select your port</h4>
            <select id="port-selector" name="port">
                <option value="" selected disabled>Select a port...</option>
            </select>

        </aside>

        <div class="panel" id="project-tree">
            <div class="tree-folder">
            </div>
        </div>

        <div class="editor-panel">
            <div class="editor-toolbar">
                <div class="editor-tabs" id="editor-tabs">
                    <!-- Editor tabs will be inserted here by JavaScript -->
                </div>



                <div class="run-buttons" id="run-buttons">

                    <button class="toolbar-button start" id="run-button" data-tooltip="Run">
                        <img src="./assets/icons/play.svg" alt="">
                    </button>

                    <button class="toolbar-button build" id="build-button" data-tooltip="Build">
                        <img src="./assets/icons/build.svg" alt="">
                    </button>

                    <button class="toolbar-button upload" id="upload-button" data-tooltip="Upload">
                        <img src="./assets/icons/cloud-upload.svg" alt="">
                    </button>



                </div>


            </div>
            <div class="editor-content">
                <div id="editor"></div>
            </div>
        </div>


    </div>


    <section id="console-panel">
        <div id="console-header">
            <span class="console-title">TERMINAL</span>
        </div>

        <div id="console-output"></div>
    </section>
    <div id="toast-container"></div>
    <script type="module" src="./toasts.js"></script>
    <script type="module" src="./run-before-all.js"></script>
    <script type="module" src="./menu-actions.js"></script>
    <script type="module" src="./menu.js"></script>

    <script type="module" src="./toolbar-buttons.js"></script>
    <script type="module" src="./tooltips.js"></script>
    <script type="module" src="/sidebar.js"></script>
    <script type="module" src="./resizers.js"></script>
    <script type="module" src="./console.js"></script>
    <script type="module" src="/editor.js"></script>
    <script type="module" src="/app.js"></script>


</body>

</html>
