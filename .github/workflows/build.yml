name: Release HobbySpark

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          pyinstaller tks.py ^
            --windowed ^
            --onedir ^
            --name HobbySpark
          powershell Compress-Archive dist/HobbySpark HobbySpark-Windows-x64.zip

      - name: Build (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          pyinstaller tks.py \
            --windowed \
            --onedir \
            --name HobbySpark
          tar -czf HobbySpark-Linux-x64.tar.gz dist/HobbySpark

      - name: Build (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          pyinstaller tks.py \
            --windowed \
            --onedir \
            --name HobbySpark
          cd dist
          zip -r ../HobbySpark-macOS.zip HobbySpark.app

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            HobbySpark-Windows-x64.zip
            HobbySpark-Linux-x64.tar.gz
            HobbySpark-macOS.zip
          generate_release_notes: true